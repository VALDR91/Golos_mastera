<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГолосМастера v0.5 (Cal AI)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#F4F4F6] text-[#09090B] min-h-screen pb-24 no-tap-highlight select-none">

    <!-- ВЕРХНЯЯ СКРЫТАЯ ПАНЕЛЬ ДЛЯ КОПИРОВАНИЯ КОДА С ТЕЛЕФОНА -->
    <div id="devExportBar" class="bg-emerald-800 text-emerald-100 px-4 py-2 text-xs flex justify-between items-center shadow-md">
        <span class="truncate font-mono">v0.5 (Cal AI Style)</span>
        <button onclick="copySourceCode()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1 rounded-lg shadow transition active:scale-95">
            📋 Копировать код
        </button>
    </div>

    <!-- ШАПКА ПРИЛОЖЕНИЯ -->
    <header class="bg-white border-b border-zinc-200 px-4 py-3 sticky top-0 z-20 flex justify-between items-center shadow-xs">
        <div>
            <h1 class="font-bold text-base text-zinc-900 flex items-center gap-1.5">
                ⚡ ГолосМастера
            </h1>
            <p id="currentObjectSubtitle" class="text-xs text-zinc-500 truncate max-w-[220px]">Загрузка объекта...</p>
        </div>
        <button onclick="openObjectsModal()" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 px-3 py-1.5 rounded-xl text-xs font-semibold border border-zinc-200 active:scale-95 transition">
            📁 Объекты
        </button>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- КАРТОЧКА БЮДЖЕТА (CAL AI STYLE) -->
        <section class="bg-white border border-zinc-200/80 rounded-3xl p-5 shadow-sm space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">Итого по сметe</span>
                    <h2 id="objectTotalSum" class="text-3xl font-extrabold text-zinc-900 font-mono-num mt-0.5">0 ₽</h2>
                </div>
                <div class="bg-orange-50 text-orange-600 px-2.5 py-1 rounded-full text-[11px] font-bold">
                    PRO Смета
                </div>
            </div>

            <!-- Аванс и остаток -->
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-100 text-xs">
                <div class="bg-zinc-50 p-2.5 rounded-2xl border border-zinc-100 cursor-pointer" onclick="editAdvance()">
                    <span class="text-zinc-400 block text-[10px] uppercase">Аванс</span>
                    <strong id="advanceDisplay" class="text-zinc-800 font-mono-num text-sm">0 ₽</strong>
                </div>
                <div class="bg-zinc-50 p-2.5 rounded-2xl border border-zinc-100">
                    <span class="text-zinc-400 block text-[10px] uppercase">Остаток</span>
                    <strong id="balanceDisplay" class="text-orange-600 font-mono-num text-sm">0 ₽</strong>
                </div>
            </div>
        </section>

        <!-- ПАНЕЛЬ ГОЛОСОВОГО ВВОДА -->
        <section class="bg-white border border-zinc-200/80 rounded-3xl p-4 shadow-sm text-center">
            <button id="micBtn" onclick="toggleSpeechRecognition()" class="w-full bg-zinc-900 hover:bg-zinc-800 active:scale-98 text-white font-bold py-4 px-6 rounded-2xl shadow-md flex items-center justify-center gap-3 transition text-sm">
                <span id="micIcon" class="text-lg">🎙️</span>
                <span id="micText">Надиктовать позицию</span>
            </button>
            <div id="speechStatus" class="text-xs text-zinc-400 mt-2 min-h-[16px]">Нажмите кнопку и говорите смету...</div>
        </section>

        <!-- СПИСОК ПОЗИЦИЙ -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Позиции в смете</h3>
                <button onclick="openAddManualModal()" class="text-xs text-orange-600 font-bold hover:underline">+ Ручной ввод</button>
            </div>
            
            <div id="itemsList" class="space-y-2">
                <!-- Сюда рендерятся позиции -->
            </div>
        </section>

        <!-- КНОПКИ ЭКСПОРТА -->
        <section class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="exportText()" class="bg-white hover:bg-zinc-50 border border-zinc-200 text-zinc-800 py-3.5 px-4 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 transition shadow-xs active:scale-95">
                💬 Текст для мессенджеров
            </button>
            <button onclick="exportPDF()" class="bg-white hover:bg-zinc-50 border border-zinc-200 text-zinc-800 py-3.5 px-4 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 transition shadow-xs active:scale-95">
                📄 Печать / PDF
            </button>
        </section>

    </main>

    <!-- МОДАЛЬНОЕ ОКНО: УПРАВЛЕНИЕ ОБЪЕКТАМИ -->
    <div id="objectsModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-zinc-200 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-zinc-900">Список объектов</h3>
                <button onclick="closeObjectsModal()" class="text-zinc-400 hover:text-zinc-700 text-sm font-bold p-1">✕</button>
            </div>
            <div id="objectsListModal" class="space-y-2 max-h-60 overflow-y-auto">
                <!-- Список объектов -->
            </div>
            <div class="pt-2 border-t border-zinc-100 flex gap-2">
                <input type="text" id="newObjectNameInput" placeholder="Например: ЖК Люблинский парк" class="flex-1 bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-xs text-zinc-900 focus:outline-none focus:border-orange-500">
                <button onclick="createNewObject()" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition">Создать</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: РЕДАКТИРОВАНИЕ ПОЗИЦИИ -->
    <div id="editItemModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-zinc-200 w-full max-w-sm rounded-3xl p-5 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-zinc-900">Редактировать позицию</h3>
                <button onclick="closeEditModal()" class="text-zinc-400 hover:text-zinc-700 text-sm font-bold p-1">✕</button>
            </div>
            <input type="hidden" id="editIndex">
            <div>
                <label class="text-[10px] uppercase text-zinc-400 font-bold">Название</label>
                <input type="text" id="editName" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-xs text-zinc-900 mt-1 focus:outline-none focus:border-orange-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Количество</label>
                    <input type="number" step="any" id="editQty" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-xs text-zinc-900 mt-1 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Цена за ед. (₽)</label>
                    <input type="number" id="editPrice" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-xs text-zinc-900 mt-1 focus:outline-none focus:border-orange-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Раздел</label>
                    <select id="editCategory" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-xs text-zinc-900 mt-1 focus:outline-none focus:border-orange-500">
                        <option value="Работа">Работа</option>
                        <option value="Материал">Материал</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Ед. изм.</label>
                    <select id="editUnit" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-xs text-zinc-900 mt-1 focus:outline-none focus:border-orange-500">
                        <option value="м²">м²</option>
                        <option value="пог. м">пог. м</option>
                        <option value="шт">шт</option>
                        <option value="мешк.">мешк.</option>
                        <option value="точка">точка</option>
                        <option value="рейс">рейс</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="deleteCurrentItem()" class="bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-xs font-bold transition">Удалить</button>
                <button onclick="saveEditedItem()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-white py-3 rounded-xl text-xs font-bold transition">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ЛОГИКА ПРИЛОЖЕНИЯ -->
    <script>
        let db = JSON.parse(localStorage.getItem('golos_master_cal_ai')) || {
            currentObjId: 'obj_1',
            objects: {
                'obj_1': {
                    name: 'ЖК Люблинский парк',
                    advance: 0,
                    items: []
                }
            }
        };

        function saveDB() {
            localStorage.setItem('golos_master_cal_ai', JSON.stringify(db));
            renderApp();
        }

        function getActiveObj() {
            if (!db.objects[db.currentObjId]) {
                db.currentObjId = Object.keys(db.objects)[0] || 'obj_1';
            }
            if (!db.objects[db.currentObjId]) {
                db.objects['obj_1'] = { name: 'Мой объект', advance: 0, items: [] };
                db.currentObjId = 'obj_1';
            }
            return db.objects[db.currentObjId];
        }

        function renderApp() {
            let obj = getActiveObj();
            document.getElementById('currentObjectSubtitle').innerText = obj.name;

            let itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = '';
            let totalSum = 0;

            if (obj.items.length === 0) {
                itemsList.innerHTML = `<div class="text-center py-10 text-zinc-400 text-xs">В смете пока нет позиций.<br>Нажмите кнопку микрофона или ручной ввод.</div>`;
            } else {
                obj.items.forEach((item, index) => {
                    let total = item.qty * item.price;
                    totalSum += total;
                    itemsList.innerHTML += `
                        <div onclick="openEditModal(${index})" class="bg-white border border-zinc-200/80 rounded-2xl p-3.5 flex justify-between items-center active:border-orange-500 transition cursor-pointer shadow-xs">
                            <div>
                                <div class="font-semibold text-xs text-zinc-900">${item.name}</div>
                                <div class="text-[10px] text-zinc-400 mt-0.5"><span class="text-orange-600 font-medium">${item.category}</span> • ${item.qty} ${item.unit} × ${item.price} ₽</div>
                            </div>
                            <div class="text-right font-bold text-xs text-zinc-900 font-mono-num">
                                ${total.toLocaleString()} ₽
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('objectTotalSum').innerText = totalSum.toLocaleString() + ' ₽';
            document.getElementById('advanceDisplay').innerText = (obj.advance || 0).toLocaleString() + ' ₽';
            let balance = totalSum - (obj.advance || 0);
            document.getElementById('balanceDisplay').innerText = balance.toLocaleString() + ' ₽';
        }

        function openObjectsModal() {
            let list = document.getElementById('objectsListModal');
            list.innerHTML = '';
            for (let oId in db.objects) {
                let o = db.objects[oId];
                let isCurrent = oId === db.currentObjId;
                list.innerHTML += `
                    <div onclick="switchObject('${oId}')" class="p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${isCurrent ? 'bg-orange-50 border-orange-200 text-orange-900 font-semibold' : 'bg-zinc-50 border-zinc-200 text-zinc-700'}">
                        <span class="text-xs">${o.name}</span>
                        ${isCurrent ? '<span class="text-[10px] text-orange-600 font-bold">Активный</span>' : ''}
                    </div>
                `;
            }
            document.getElementById('objectsModal').classList.remove('hidden');
        }

        function closeObjectsModal() {
            document.getElementById('objectsModal').classList.add('hidden');
        }

        function switchObject(oId) {
            db.currentObjId = oId;
            closeObjectsModal();
            saveDB();
        }

        function createNewObject() {
            let name = document.getElementById('newObjectNameInput').value.trim();
            if (!name) return;
            let oId = 'obj_' + Date.now();
            db.objects[oId] = { name: name, advance: 0, items: [] };
            db.currentObjId = oId;
            document.getElementById('newObjectNameInput').value = '';
            closeObjectsModal();
            saveDB();
        }

        function editAdvance() {
            let obj = getActiveObj();
            let val = prompt('Введите сумму полученного аванса:', obj.advance || 0);
            if (val !== null) {
                obj.advance = parseFloat(val) || 0;
                saveDB();
            }
        }

        function openEditModal(index) {
            let obj = getActiveObj();
            let item = obj.items[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editName').value = item.name;
            document.getElementById('editQty').value = item.qty;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editUnit').value = item.unit;
            document.getElementById('editItemModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editItemModal').classList.add('hidden');
        }

        function saveEditedItem() {
            let index = parseInt(document.getElementById('editIndex').value);
            let obj = getActiveObj();
            obj.items[index] = {
                name: document.getElementById('editName').value,
                qty: parseFloat(document.getElementById('editQty').value) || 0,
                price: parseFloat(document.getElementById('editPrice').value) || 0,
                category: document.getElementById('editCategory').value,
                unit: document.getElementById('editUnit').value
            };
            closeEditModal();
            saveDB();
        }

        function deleteCurrentItem() {
            let index = parseInt(document.getElementById('editIndex').value);
            let obj = getActiveObj();
            obj.items.splice(index, 1);
            closeEditModal();
            saveDB();
        }

        function openAddManualModal() {
            let obj = getActiveObj();
            obj.items.push({ name: 'Новая позиция', qty: 1, price: 1000, category: 'Работа', unit: 'м²' });
            saveDB();
            openEditModal(obj.items.length - 1);
        }

        let recognition = null;
        let isRecording = false;

        function toggleSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Голосовой ввод недоступен в этом браузере.');
                return;
            }

            if (isRecording) {
                stopSpeech();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('micBtn').className = "w-full bg-red-600 hover:bg-red-500 active:scale-98 text-white font-bold py-4 px-6 rounded-2xl shadow-md flex items-center justify-center gap-3 transition text-sm animate-pulse";
                document.getElementById('micIcon').innerText = "⏹️";
                document.getElementById('micText').innerText = "Слушаю...";
                document.getElementById('speechStatus').innerText = "Говорите позицию сметы...";
            };

            recognition.onresult = (event) => {
                let text = event.results[0][0].transcript;
                document.getElementById('speechStatus').innerText = `Распознано: "${text}"`;
                parseVoiceText(text);
            };

            recognition.onerror = () => {
                document.getElementById('speechStatus').innerText = "Ошибка распознавания.";
                stopSpeech();
            };

            recognition.onend = () => {
                stopSpeech();
            };

            recognition.start();
        }

        function stopSpeech() {
            isRecording = false;
            document.getElementById('micBtn').className = "w-full bg-zinc-900 hover:bg-zinc-800 active:scale-98 text-white font-bold py-4 px-6 rounded-2xl shadow-md flex items-center justify-center gap-3 transition text-sm";
            document.getElementById('micIcon').innerText = "🎙️";
            document.getElementById('micText').innerText = "Надиктовать позицию";
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
        }

        function parseVoiceText(text) {
            let obj = getActiveObj();
            obj.items.push({
                name: text,
                qty: 1,
                price: 0,
                category: 'Работа',
                unit: 'м²'
            });
            saveDB();
            openEditModal(obj.items.length - 1);
        }

        function exportText() {
            let obj = getActiveObj();
            let text = `📋 Смета: ${obj.name}\n`;
            let sum = 0;
            obj.items.forEach(i => {
                let t = i.qty * i.price;
                sum += t;
                text += `• ${i.name}: ${i.qty}
